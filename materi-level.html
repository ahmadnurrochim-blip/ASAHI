<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Materi Level - Asahi Mandiri</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Shippori+Mincho:wght@600;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/leveling-popup.css" />
<script type="module" src="js/firebase-config.js"></script>
<script type="module" src="js/firebase-init.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red: #bc002d;
      --red-dark: #8b0022;
      --ink: #1a1a1a;
      --paper: #fdfaf5;
      --gold: #c9a227;
      --green: #10b981;
      --gray: #6b7280;
      --gray-light: #9ca3af;
      --border: #e8e2d8;
    }

    body {
      font-family: 'Noto Sans JP', 'Segoe UI', sans-serif;
      color: var(--ink);
      background: var(--paper);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .bg {
      position: fixed; inset: 0; z-index: -2;
      background-image:
        linear-gradient(rgba(253, 250, 245, 0.88), rgba(253, 250, 245, 0.94)),
        url('https://images.unsplash.com/photo-1528360983277-13d401cdc186?auto=format&fit=crop&w=1920&q=80');
      background-size: cover; background-position: center; background-attachment: fixed;
    }

    .bg-pattern {
      position: fixed; inset: 0; z-index: -1; opacity: 0.06;
      background-image: radial-gradient(circle at 50% 100%, transparent 20%, var(--red) 21%, var(--red) 34%, transparent 35%, transparent 40%, var(--red) 41%, var(--red) 54%, transparent 55%);
      background-size: 80px 40px; pointer-events: none;
    }

    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(253, 250, 245, 0.92);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-bottom: 3px solid var(--red);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    }

    .header-inner {
      max-width: 1200px; margin: 0 auto; padding: 14px 28px;
      display: flex; align-items: center; justify-content: space-between; gap: 20px;
    }

    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink); flex-shrink: 0; }
    .brand-mark {
      width: 44px; height: 44px; border-radius: 50%; background: var(--red);
      display: grid; place-items: center; color: #fff;
      font-family: 'Shippori Mincho', serif; font-weight: 800; font-size: 20px;
      box-shadow: 0 0 0 3px rgba(188, 0, 45, 0.15); position: relative;
    }
    .brand-mark::after {
      content: ''; position: absolute; inset: -6px; border-radius: 50%;
      border: 2px dashed rgba(188, 0, 45, 0.4); animation: spin 20s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .brand-text { display: flex; flex-direction: column; line-height: 1.1; }
    .brand-text .jp { font-family: 'Shippori Mincho', serif; font-size: 20px; font-weight: 800; letter-spacing: 1px; }
    .brand-text .en { font-size: 10px; letter-spacing: 3px; color: var(--red); font-weight: 700; text-transform: uppercase; }

    .nav-buttons { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .nav-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 600;
      text-decoration: none; color: var(--ink); background: #fff;
      border: 2px solid #e8e2d8; transition: all 0.25s ease; cursor: pointer;
    }
    .nav-btn i { color: var(--red); font-size: 13px; }
    .nav-btn:hover {
      border-color: var(--red); color: var(--red);
      transform: translateY(-2px); box-shadow: 0 6px 16px rgba(188, 0, 45, 0.18);
    }
    .nav-btn.active { background: var(--red); border-color: var(--red); color: #fff; }
    .nav-btn.active i { color: #fff; }

    .container { max-width: 900px; margin: 0 auto; padding: 50px 28px 80px; position: relative; }

    .kanji-watermark {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-family: 'Shippori Mincho', serif; font-size: 340px; font-weight: 800;
      color: rgba(188, 0, 45, 0.04); z-index: -1;
      user-select: none; pointer-events: none; line-height: 1;
    }

    .page-title { text-align: center; margin-bottom: 30px; }

    .page-title .badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: #fff; border: 2px solid var(--red); color: var(--red);
      font-size: 11px; font-weight: 700; letter-spacing: 2px;
      padding: 7px 16px; border-radius: 999px; margin-bottom: 18px; text-transform: uppercase;
    }

    .page-title h1 {
      font-family: 'Shippori Mincho', serif;
      font-size: clamp(28px, 4vw, 40px); font-weight: 800;
      margin-bottom: 10px; line-height: 1.2;
    }

    .page-title h1 .accent { color: var(--red); }

    .page-title p { font-size: 15px; color: var(--gray); max-width: 560px; margin: 0 auto; line-height: 1.7; }

    .progress-wrap {
      max-width: 460px; margin: 24px auto 0;
      background: #fff; border: 2px solid var(--border);
      border-radius: 999px; padding: 8px 8px 8px 18px;
      display: flex; align-items: center; gap: 14px;
    }
    .progress-bar { flex: 1; height: 10px; background: #f0e9dc; border-radius: 999px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--red), #ff3b63); border-radius: 999px; transition: width 0.4s ease; }
    .progress-text { font-size: 12px; font-weight: 800; color: var(--red); white-space: nowrap; padding-right: 10px; }

    .info-box {
      background: #fff9ec; border: 2px dashed #fcd34d;
      border-radius: 14px; padding: 16px 18px; margin-top: 24px;
      font-size: 13px; color: #92400e; line-height: 1.6;
      display: flex; gap: 10px; align-items: flex-start;
    }
    .info-box i { color: #d97706; margin-top: 3px; flex-shrink: 0; font-size: 15px; }

    .vocab-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px; margin-top: 26px;
    }

    .vocab-card {
      position: relative; background: rgba(255, 255, 255, 0.97);
      border: 2px solid #f0e9dc; border-radius: 18px;
      padding: 22px 20px 18px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.04);
      transition: all 0.3s ease; cursor: pointer; overflow: hidden;
      text-align: center;
    }
    .vocab-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
      background: linear-gradient(90deg, var(--red), var(--gold));
      opacity: 0; transition: opacity 0.3s ease;
    }
    .vocab-card:hover {
      transform: translateY(-4px); border-color: var(--red);
      box-shadow: 0 14px 30px rgba(188, 0, 45, 0.14);
    }
    .vocab-card:hover::before { opacity: 1; }

    .vocab-card .num {
      position: absolute; top: 12px; right: 14px;
      font-family: 'Shippori Mincho', serif; font-size: 11px; font-weight: 800;
      color: var(--gray-light); background: #fdfaf5;
      border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px;
    }
    .vocab-card .jp {
      font-family: 'Shippori Mincho', serif; font-size: 32px; font-weight: 800;
      color: var(--ink); margin-bottom: 6px; line-height: 1.3; letter-spacing: 1px;
    }
    .vocab-card .romaji {
      font-size: 13px; font-weight: 700; color: var(--red);
      letter-spacing: 1px; margin-bottom: 10px; text-transform: uppercase;
    }
    .vocab-card .arti {
      font-size: 14px; color: var(--gray); line-height: 1.5; margin-bottom: 14px;
    }
    .vocab-card .actions {
      display: flex; gap: 8px; padding-top: 12px; border-top: 1px dashed #f0e9dc;
    }

    .icon-btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 6px; flex: 1; padding: 8px 10px;
      font-family: inherit; font-size: 12px; font-weight: 700;
      border-radius: 10px; border: 2px solid var(--border);
      background: #fff; color: var(--gray); cursor: pointer;
      transition: all 0.2s ease;
    }
    .icon-btn:hover { border-color: var(--red); color: var(--red); background: #fff5f7; }
    .icon-btn.playing { background: var(--red); border-color: var(--red); color: #fff; }

    .nav-bottom {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; margin-top: 40px; padding-top: 30px;
      border-top: 2px dashed #f0e9dc; flex-wrap: wrap;
    }

    .btn {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 14px 28px; border-radius: 12px; font-size: 14px; font-weight: 700;
      text-decoration: none; cursor: pointer; border: none;
      transition: all 0.25s ease; font-family: inherit;
    }
    .btn-primary { background: var(--red); color: #fff; box-shadow: 0 8px 20px rgba(188, 0, 45, 0.25); }
    .btn-primary:hover { background: var(--red-dark); transform: translateY(-2px); box-shadow: 0 12px 26px rgba(188, 0, 45, 0.35); }
    .btn-ghost { background: #fff; color: var(--ink); border: 2px solid var(--border); }
    .btn-ghost:hover { border-color: var(--red); color: var(--red); }

    .not-found {
      text-align: center; padding: 60px 20px;
      background: #fff; border-radius: 20px; border: 2px solid #f0e9dc;
    }
    .not-found i { font-size: 60px; color: var(--gray-light); margin-bottom: 16px; display: block; }
    .not-found h2 { font-family: 'Shippori Mincho', serif; font-size: 24px; font-weight: 800; margin-bottom: 8px; }
    .not-found p { font-size: 14px; color: var(--gray); margin-bottom: 20px; }

    footer {
      text-align: center; padding: 30px 20px;
      font-size: 13px; color: var(--gray-light);
      border-top: 1px solid #eae3d6;
      background: rgba(253, 250, 245, 0.9); margin-top: 40px;
    }
    footer .jp { font-family: 'Shippori Mincho', serif; color: var(--red); letter-spacing: 4px; display: block; margin-bottom: 6px; font-size: 14px; }

    @media (max-width: 820px) {
      .header-inner { flex-direction: column; align-items: flex-start; gap: 14px; }
      .nav-buttons { width: 100%; justify-content: flex-start; }
      .nav-btn { flex: 1 1 auto; justify-content: center; padding: 9px 14px; font-size: 13px; }
      .container { padding: 32px 18px 60px; }
      .vocab-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
    }
    @media (max-width: 480px) {
      .nav-btn span { display: none; }
      .nav-btn i { font-size: 15px; }
      .brand-text .jp { font-size: 17px; }
      .kanji-watermark { font-size: 200px; }
      .vocab-grid { grid-template-columns: 1fr; }
      .nav-bottom { flex-direction: column-reverse; }
      .nav-bottom .btn { width: 100%; justify-content: center; }
    }
  </style>
</head>

<body>

  <div class="bg"></div>
  <div class="bg-pattern"></div>

  <header>
    <div class="header-inner">
      <a href="index.html" class="brand">
        <div class="brand-mark">朝</div>
        <div class="brand-text">
          <span class="jp">Asahi Mandiri</span>
          <span class="en">Japanese Learning</span>
        </div>
      </a>
      <nav class="nav-buttons">
        <a href="index.html" class="nav-btn">
          <i class="fas fa-home"></i> <span>Beranda</span>
        </a>
        <a href="latihan.html" class="nav-btn">
          <i class="fas fa-pen-fancy"></i> <span>Latihan</span>
        </a>
        <a href="materi.html" class="nav-btn active">
          <i class="fas fa-book-open"></i> <span>Materi</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="kanji-watermark">基本</div>
    <div id="content"></div>
  </main>

  <footer>
    <span class="jp">朝日 自立</span>
    © 2026 Asahi Mandiri. Semua hak dilindungi.
  </footer>

  <script src="js/leveling-popup.js"></script>
  <script src="js/materi-data.js"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const levelNum = parseInt(params.get('level'), 10);
    const content = document.getElementById('content');

    const data = (window.MATERI_DATA || {})['materi-' + levelNum];

    if (!data) {
      content.innerHTML = `
        <div class="not-found">
          <i class="fas fa-book-open"></i>
          <h2>Materi Tidak Ditemukan</h2>
          <p>Level <strong>${levelNum || '(kosong)'}</strong> belum tersedia.</p>
          <a href="materi.html" class="btn btn-primary" style="display:inline-flex;">
            <i class="fas fa-arrow-left"></i> Kembali ke Materi
          </a>
        </div>
      `;
    } else {
      renderMateri(data);
    }

    function renderMateri(data) {
      // Bangun kartu
      const vocabHTML = (data.vocab || []).map((v, i) => `
        <div class="vocab-card" data-idx="${i}">
          <span class="num">#${String(i + 1).padStart(2, '0')}</span>
          <div class="jp">${v.jp}</div>
          ${v.romaji ? `<div class="romaji">${v.romaji}</div>` : ''}
          <div class="arti">${v.arti}</div>
          <div class="actions">
            <button class="icon-btn btn-play" data-jp="${v.jp.replace(/"/g, '&quot;')}">
              <i class="fas fa-volume-up"></i> Dengar
            </button>
            <button class="icon-btn btn-hafal">
              <i class="fas fa-check"></i> Hafal
            </button>
          </div>
        </div>
      `).join('');

      // Nav bawah
      const prevLevel = levelNum > 1 ? levelNum - 1 : null;
      const nextLevel = levelNum < 50 ? levelNum + 1 : null;

      const prevBtn = prevLevel
        ? `<a href="materi-level.html?level=${prevLevel}" class="btn btn-ghost">
             <i class="fas fa-arrow-left"></i> Level ${prevLevel}
           </a>`
        : `<a href="materi.html" class="btn btn-ghost">
             <i class="fas fa-arrow-left"></i> Kembali ke Materi
           </a>`;

      const nextBtn = nextLevel
        ? `<a href="materi-level.html?level=${nextLevel}" class="btn btn-primary">
             Lanjut ke Level ${nextLevel} <i class="fas fa-arrow-right"></i>
           </a>`
        : `<a href="materi.html" class="btn btn-primary">
             Selesai <i class="fas fa-flag-checkered"></i>
           </a>`;

      content.innerHTML = `
        <div class="page-title">
          <div class="badge">
            <i class="fas fa-seedling"></i> レベル ${levelNum}
          </div>
          <h1>Level ${levelNum} — <span class="accent">${data.title}</span></h1>
          ${data.jp ? `<div class="jp-sub" style="font-family:'Shippori Mincho',serif; font-size:16px; color:var(--red); letter-spacing:3px; margin-bottom:8px;">${data.jp}</div>` : ''}
          <p>${data.desc || ''}</p>

          <div class="progress-wrap">
            <div class="progress-bar">
              <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="progress-text" id="progressText">0 / ${(data.vocab || []).length}</span>
          </div>
        </div>

        ${data.tips ? `
          <div class="info-box">
            <i class="fas fa-lightbulb"></i>
            <span><strong>Tips:</strong> ${data.tips}</span>
          </div>
        ` : ''}

        <div class="vocab-grid" id="vocabGrid">
          ${vocabHTML}
        </div>

        <div class="nav-bottom">
          ${prevBtn}
          ${nextBtn}
        </div>
      `;

      // Event listener
      const grid = document.getElementById('vocabGrid');

      // Tombol dengar
      grid.querySelectorAll('.btn-play').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const jp = btn.dataset.jp;
          const card = btn.closest('.vocab-card');
          speak(jp, card);
        });
      });

      // Tombol hafal
      grid.querySelectorAll('.btn-hafal').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          btn.classList.toggle('playing');
          btn.innerHTML = btn.classList.contains('playing')
            ? '<i class="fas fa-check-circle"></i> Hafal'
            : '<i class="fas fa-check"></i> Hafal';
          updateProgress();
        });
      });

      // Klik kartu = dengar
      grid.querySelectorAll('.vocab-card').forEach(card => {
        const jp = card.querySelector('.jp').textContent;
        card.addEventListener('click', () => speak(jp, card));
      });

      updateProgress();
    }

    function speak(text, card) {
      if (!('speechSynthesis' in window)) {
        alert('Browser kamu tidak mendukung fitur suara.');
        return;
      }
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'ja-JP';
      utter.rate = 0.75;
      utter.pitch = 1;
      if (card) {
        card.classList.add('playing');
        utter.onend = () => card.classList.remove('playing');
      }
      window.speechSynthesis.speak(utter);
    }

    function updateProgress() {
      const total = document.querySelectorAll('.btn-hafal').length;
      const done = document.querySelectorAll('.btn-hafal.playing').length;
      const pct = total > 0 ? (done / total) * 100 : 0;
      const fill = document.getElementById('progressFill');
      const text = document.getElementById('progressText');
      if (fill) fill.style.width = pct + '%';
      if (text) text.textContent = `${done} / ${total}`;
    }
  </script>

</body>
</html>
